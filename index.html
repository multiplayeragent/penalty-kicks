<script type="module">
/* ═══ PENALTY KICKS · a Multiplayer Agent starter ════════════════════════════════════════════
 * A penalty shootout under the floodlights: Foxes (orange) against Herons (blue), 2–8 players.
 * Each kick is a duel: the kicker aims at the goal and times a power bar, the keeper picks a dive,
 * both in secret. Then the kick plays out and shows who guessed right. Five kicks a team, then
 * sudden death. Kickers and keepers rotate, so everyone kicks and everyone goes in goal.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ timers, kicks per team, goal size, power bar, aim error, save odds, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host, the host's clock
 *   PITCH ......... goal, nets (the back net ripples), lines, stands, crowd, floodlights, players, ball
 *   SHOOTOUT (HOST) teams, whose turn, the secret picks, the outcome of a kick, the score, the winner
 *   BOTS .......... how bots aim, power up and dive (each has a favorite side)
 *   ME ............ my turn: aiming and the power bar, or picking a dive; re-sending a pick to a new host
 *   KICK .......... the kick played out from its result: run-up, ball flight, the dive, net, post, save
 *   DRAW .......... placing everyone, the camera, effects
 *   HUD & RESULTS . scoreboard, the duel line, the clock, calls, results card, leaderboard
 *   INPUT ......... mouse, keyboard, touch
 *   MAIN LOOP ..... one frame: host work, drawing
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `n`/`c` (name, color) once, `hb` (heartbeat) once a second,
 *     `rdy` (Play again). Nothing else: nobody moves freely, the shootout places everyone.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s), worked out
 *     every frame. Only the host writes the shared fields:
 *       `game` {id, v, phase, teams, first, k, endsAt, at, ack, res, marks, st, win}: the teams (sessionIds
 *              or bots "b1".."b8"), kick number k (who kicks and who keeps follow from it), the pick timer,
 *              `ack` = which picks are in (not WHAT they are), `res` = the revealed kick (aim, power, dive,
 *              result), `marks` = each team's goals and misses. `v` goes up on every write.
 *       `clk`: the host's clock, twice a second (for the countdown).
 *   - THE PICKS ARE SECRET. The kicker sends "pick" {k, role:"kick", ax, ay, pw}, the keeper "pick" {k,
 *     role:"keep", dv}, straight to the host, which keeps them in its own memory: they never go into
 *     shared state until both are in (or time runs out). Then the host works out the result and writes
 *     both picks together in `res`, so every screen plays the same kick. A host that takes over starts
 *     with no picks, so it clears `ack` and every player re-sends its pick for this kick.
 *   - Someone who joins takes a bot's place (or joins the smaller team); someone who leaves is replaced.
 *   - ?attract plays offline, bots only (the preview video is recorded from it).
 *   - Leaderboard "penalty-goals": every goal you score adds 1 to your total.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  kicks: 5,               // kicks per team before sudden death
  maxSudden: 10,          // after this many sudden-death rounds it's a draw
  maxTeam: 4,             // players per team (bots fill a team up to the other's size)
  introMs: 2600,          // before the first kick
  pickMs: 8000,           // time to aim / pick a dive
  kickMs: 3900,           // the kick playing out, then the next one
  resultsMs: 15000,       // the results card before the next shootout (Play again skips it)
  // The goal in metres: the goal line is z = 0, the penalty spot is at z = 11.
  goalW: 7.32, goalH: 2.44, spot: 11, netDepth: 1.9, ballR: 0.13,
  // Kicking: hold to charge, release to shoot. The bar goes up and back down.
  chargeMs: 950,          // ms for the bar to go from empty to full
  sweet: [0.62, 0.86],    // the green zone: full speed and on target
  aimErr: 0.07,           // how far (in half-goal widths) any kick can stray
  overErr: 1.7,           // ...extra stray per bit of power past the green zone (it can fly over)
  underErr: 0.25,         // ...extra stray per bit of power short of it
  // Saving
  saveSameSide: 0.8,      // the keeper went the right way: chance to save a middling kick
  powerBeatsKeeper: 0.3,  // a kick in the green zone takes this off the save chance
  cornerBeatsKeeper: 0.4, // a kick into a top corner takes this off it
  staySave: 0.45,         // the keeper stayed and the kick came near the middle
  // Bots
  botPickMs: [1200, 4200], // how long a bot takes to lock in its pick
  botPower: 0.72, botPowerSpread: 0.1,
  board: "penalty-goals",
};
const TEAMS = [{ name: "Foxes", color: "#ff7a2f", dark: "#8a3a10", keeper: "#c6ff3d" }, { name: "Herons", color: "#3d8bff", dark: "#123f8a", keeper: "#ff4fd8" }];
const COLORS = ["#ffd23f", "#ffffff", "#7cf29a", "#c99bff", "#ff8fd0", "#3ee6d8", "#b6ff4a", "#ffa94d"]; // each player's own color: boots, ring, name
const BOT_NAMES = ["Rocket Rae", "Big Boots", "Curly", "Nutmeg", "The Wall", "Lefty", "Banana", "Dino"]; // bot "b1" is Rocket Rae
const SKINS = ["#f1c9a5", "#c68a5a", "#8d5a3b", "#e8b48a", "#5e3a24"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'penalty-kicks',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
const TEST = new URLSearchParams(location.search).has("test");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},

async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A JSON field, parsed once per change (read-only: never mutate what this returns). */
function cached(key, raw, fb) { const m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
/** Am I the host? Never in the first 0.7s after this tab wakes from a freeze (fresh state arrives first). */
const isHost = () => performance.now() >= host.quietUntil && livePlayers()[0] === net.sessionId;
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId)); // in the preview you only watch
/** The host's clock: it writes `clk` twice a second; we keep the smallest delay seen lately. */
const clock = { off: 0, samples: [], last: null };
function noteHostClock() {
  const w = S.shared.clk;
  if (typeof w !== "number" || w === clock.last) return;
  clock.last = w;
  const now = performance.now();
  clock.samples.push({ at: now, d: w - Date.now() });
  while (clock.samples.length && now - clock.samples[0].at > 5000) clock.samples.shift();
  clock.off = Math.max(...clock.samples.map((s) => s.d));
}
const hostNow = () => Date.now() + (net.offline || isHost() ? 0 : clock.off);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, u) => a + (b - a) * u;
const r2 = (v) => Math.round(v * 100) / 100;
const isBot = (id) => /^b\d+$/.test(id || "");
const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
const GW = CONFIG.goalW / 2, GH = CONFIG.goalH, SPOT = CONFIG.spot, BR = CONFIG.ballR;

// ── PITCH ───────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const cv = renderer.domElement;
const scene = new THREE.Scene();
scene.background = new THREE.Color("#0b1630");
scene.fog = new THREE.Fog("#0b1630", 45, 110);
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 300);
function fit() {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 34 + (1 - camera.aspect) * 52 : 34; camera.updateProjectionMatrix();
}
addEventListener("resize", fit); addEventListener("orientationchange", fit); fit();
scene.add(new THREE.HemisphereLight("#bcd4ff", "#1d3b1d", 1.1));
const flood = new THREE.DirectionalLight("#fff6e0", 2.2);
flood.position.set(8, 22, 18); flood.target.position.set(0, 0, 4); flood.castShadow = true; flood.shadow.mapSize.set(1024, 1024);
Object.assign(flood.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 70 }); scene.add(flood, flood.target);
function canvasTex(w, h, paint) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; paint(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
// The pitch: stripes, the box, the six-yard box, the spot and the arc.
const PX0 = -26, PX1 = 26, PZ0 = -6, PZ1 = 34; // the painted area
const pitchTex = canvasTex(1024, 800, (c, w, h) => {
  const X = (x) => ((x - PX0) / (PX1 - PX0)) * w, Z = (z) => ((z - PZ0) / (PZ1 - PZ0)) * h, M = w / (PX1 - PX0);
  for (let i = 0; i < 16; i++) { c.fillStyle = i % 2 ? "#2f8f3a" : "#2a8034"; c.fillRect(0, Z(PZ0 + i * 2.5), w, 2.5 * M + 1); }
  c.strokeStyle = "#f2f6ef"; c.lineWidth = 0.12 * M;
  const rect = (x0, z0, x1, z1) => c.strokeRect(X(x0), Z(z0), X(x1) - X(x0), Z(z1) - Z(z0));
  c.beginPath(); c.moveTo(X(PX0), Z(0)); c.lineTo(X(PX1), Z(0)); c.stroke();
  rect(-20.15, 0, 20.15, 16.5); rect(-9.16, 0, 9.16, 5.5);
  c.fillStyle = "#f2f6ef"; c.beginPath(); c.arc(X(0), Z(SPOT), 0.2 * M, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(X(0), Z(SPOT), 9.15 * M, Math.asin(5.5 / 9.15), Math.PI - Math.asin(5.5 / 9.15)); c.stroke();
  c.fillStyle = "#ffffff18"; c.beginPath(); c.arc(X(0), Z(SPOT), 1.4 * M, 0, Math.PI * 2); c.fill(); // the scuffed spot
});
const pitch = new THREE.Mesh(new THREE.PlaneGeometry(PX1 - PX0, PZ1 - PZ0), new THREE.MeshStandardMaterial({ map: pitchTex, roughness: 1 }));
pitch.rotation.x = -Math.PI / 2; pitch.position.set((PX0 + PX1) / 2, 0, (PZ0 + PZ1) / 2); pitch.receiveShadow = true; scene.add(pitch);
const apron = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), new THREE.MeshStandardMaterial({ color: "#1f5e28", roughness: 1 }));
apron.rotation.x = -Math.PI / 2; apron.position.y = -0.02; scene.add(apron);
// The goal: posts and bar, and the nets. The back net is a grid we push about when the ball hits it.
const postM = new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.35, metalness: 0.1 });
const PR = 0.06;
for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.CylinderGeometry(PR, PR, GH + PR, 12), postM); p.position.set(s * GW, (GH + PR) / 2, 0); p.castShadow = true; scene.add(p); }
const bar = new THREE.Mesh(new THREE.CylinderGeometry(PR, PR, 2 * GW + 2 * PR, 12), postM); bar.rotation.z = Math.PI / 2; bar.position.set(0, GH, 0); bar.castShadow = true; scene.add(bar);
const netTex = canvasTex(256, 256, (c, w, h) => { c.strokeStyle = "#ffffffd0"; c.lineWidth = 2; for (let i = 0; i <= 16; i++) { c.beginPath(); c.moveTo(i * 16, 0); c.lineTo(i * 16, h); c.stroke(); c.beginPath(); c.moveTo(0, i * 16); c.lineTo(w, i * 16); c.stroke(); } });
netTex.wrapS = netTex.wrapT = THREE.RepeatWrapping;
const netMat = (rx, ry) => { const t = netTex.clone(); t.needsUpdate = true; t.repeat.set(rx, ry); return new THREE.MeshBasicMaterial({ map: t, transparent: true, side: THREE.DoubleSide, depthWrite: false, opacity: 0.85 }); };
const ND = CONFIG.netDepth;
const backNet = new THREE.Mesh(new THREE.PlaneGeometry(2 * GW, GH, 36, 14), netMat(8, 3)); backNet.position.set(0, GH / 2, -ND); scene.add(backNet);
const backBase = backNet.geometry.attributes.position.array.slice(); // the net at rest
const roof = new THREE.Mesh(new THREE.PlaneGeometry(2 * GW, ND), netMat(8, 2)); roof.rotation.x = Math.PI / 2; roof.position.set(0, GH, -ND / 2); scene.add(roof);
for (const s of [-1, 1]) { const side = new THREE.Mesh(new THREE.PlaneGeometry(ND, GH), netMat(2, 3)); side.rotation.y = Math.PI / 2; side.position.set(s * GW, GH / 2, -ND / 2); scene.add(side); }
for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, GH, 6), postM); p.position.set(s * GW, GH / 2, -ND); scene.add(p); }
let ripple = null; // { x, y, at }: the ball hit the back net here
function tickNet(now) {
  const pos = backNet.geometry.attributes.position, a = pos.array;
  if (!ripple) return;
  const e = (now - ripple.at) / 1000, amp = e < 0 ? 0 : Math.exp(-e * 2.2) * 0.55;
  for (let i = 0; i < a.length; i += 3) {
    const x = backBase[i], y = backBase[i + 1] + GH / 2, d2 = (x - ripple.x) ** 2 + (y - ripple.y) ** 2;
    a[i + 2] = backBase[i + 2] - amp * Math.exp(-d2 / 0.9) * Math.cos(e * 14 - Math.sqrt(d2) * 3);

  if (e > 3) { for (let i = 0; i < a.length; i++) a[i] = backBase[i]; pos.needsUpdate = true; ripple = null; }
}
// Ad boards, stands, the crowd (each half in a team's colors) and floodlight towers.

  $("msg").classList.toggle("on", now < msgUntil);
  // the scoreboard: each team's kicks so far (shown once a kick has played out)
  const showing = g.phase === "kick" && g.res && g.res.k === g.k && now - kickView.at > STRIKE + flightMs(g.res);
  for (const t of [0, 1]) {
    const marks = [...g.marks[t]];
    if (showing && g.res.kt === t) marks.push(g.res.r === "goal" ? "g" : "x");
    const slots = Math.max(K.kicks, marks.length);
    $("c" + t).style.background = TEAMS[t].color; $("t" + t).textContent = TEAMS[t].name; $("t" + t).style.color = team === t ? "#ffd23f" : "#fff";
    $("d" + t).innerHTML = Array.from({ length: Math.min(slots, 9) }, (_, i) => `<u class="${marks[i] || ""}"></u>`).join("");
    $("s" + t).textContent = marks.filter((x) => x === "g").length;
  }
  const sudden = g.marks[0].length >= K.kicks && g.marks[1].length >= K.kicks;
  $("tag").textContent = g.phase === "over" ? "FULL TIME" : sudden ? "SUDDEN DEATH" : `KICK ${Math.min(K.kicks, Math.floor(g.k / 2) + 1)} OF ${K.kicks}`;
  if (ATTRACT) { for (const id of ["duel", "clock", "role", "net", "power", "kickUI", "keepUI", "over"]) $(id).hidden = true; $("net").textContent = ""; $("sb").hidden = false; return; }
  // who's up, and who has locked in
  const r = roles(g), inPick = g.phase === "pick";
  $("duel").hidden = !(inPick || g.phase === "kick");
  const who = (id, t) => `<span style="color:${TEAMS[t].color}">${esc(id === net.sessionId ? "You" : nameOf(id))}</span>`;
  $("duel").innerHTML = `${who(r.kicker, r.kt)} <em>${r.kicker === net.sessionId ? "shoot" : "shoots"} ·</em> ${who(r.keeper, 1 - r.kt)} <em>in goal</em>` +
    (inPick ? `<small><b class="${g.ack.k ? "on" : ""}">KICKER ${g.ack.k ? "✓" : "…"}</b><b class="${g.ack.g ? "on" : ""}">KEEPER ${g.ack.g ? "✓" : "…"}</b></small>` : "");
  const left = Math.max(0, Math.ceil((g.endsAt - T) / 1000));
  $("clock").textContent = inPick ? left : "";
  if (inPick && role && !me.pick && left !== lastSec && left <= 3) { lastSec = left; sfx("tick"); }
  // my controls
  $("kickUI").hidden = !(role === "kick" && !me.pick && touchUI);
  $("keepUI").hidden = !(role === "keep" && !me.pick);
  for (const b of $("keepUI").querySelectorAll("button")) b.classList.toggle("on", !!me.pick && me.pick.dv === +b.dataset.dv);
  $("power").hidden = !(role === "kick" && !me.pick);
  if (role === "kick") {
    $("power").querySelector("i").style.cssText = `bottom:${K.sweet[0] * 100}%;height:${(K.sweet[1] - K.sweet[0]) * 100}%`;
    $("power").querySelector("b").style.height = `${(me.charging ? chargeLevel(now) : 0) * 100}%`;
  }
  const roleText = {
    kick: me.pick ? ["LOCKED IN", "Waiting for the keeper…"] : [`YOU'RE KICKING`, touchUI ? "Drag to aim. Hold KICK, let go in the green." : "Aim with the mouse or arrows. Hold click or Space, let go in the green."],
    keep: me.pick ? ["LOCKED IN", "Waiting for the kicker…"] : ["YOU'RE IN GOAL", touchUI ? "Pick a dive before the kick!" : "Pick a dive: ← left, ↓ stay, → right"],
  }[role];
  const upNext = !role && inPick && team >= 0 ? nextTurn(g) : "";
  $("role").innerHTML = roleText ? `${esc(roleText[0])}<small>${esc(roleText[1])}</small>` : upNext ? `<small>${esc(upNext)}</small>` : "";
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the shootout" : ""}`;
  // the results card
  const card = g.phase === "over" && T > g.at - K.resultsMs + 1500;
  $("over").hidden = !card;
  if (!card) return;
  const s0 = scoreOf(g, 0), s1 = scoreOf(g, 1);
  $("winner").textContent = g.win === 2 ? "It's a draw!" : team === g.win ? "You win the shootout!" : `${TEAMS[g.win].name} win!`;
  $("winner").style.color = g.win === 2 ? "#fff" : TEAMS[g.win].color;
  $("final").innerHTML = `<span style="color:${TEAMS[0].color}">${TEAMS[0].name} ${s0}</span> – <span style="color:${TEAMS[1].color}">${s1} ${TEAMS[1].name}</span>`;
  const rows = g.teams.flat().map((id) => ({ id, s: (g.st || {})[id] || [0, 0, 0, 0], t: teamOf(g, id) }));
  $("stats").innerHTML = `<tr><th>Player</th><th>Goals</th><th>Saves</th></tr>` + rows.map(({ id, s, t }) =>
    `<tr class="${id === net.sessionId ? "me" : ""}"><td><i style="background:${TEAMS[t].color}"></i>${esc(id === net.sessionId ? "You" : nameOf(id))}</td><td>${s[0]}/${s[1]}</td><td>${s[2]}/${s[3]}</td></tr>`).join("");
  $("again").hidden = team < 0;
  $("again").textContent = myReady === g.id ? "Waiting for the others…" : "Play again";
  $("next").textContent = `Next shootout in ${Math.max(0, Math.ceil((g.at - T) / 1000))}s`;
  if (boardFor !== g.id) { boardFor = g.id; showBoard(((g.st || {})[net.sessionId] || [0])[0]); }
}
/** "You kick in 2 turns" for someone watching. */
function nextTurn(g) {
  for (let k = g.k + 1; k < g.k + 2 * CONFIG.maxTeam + 2; k++) { const r = roles(g, k); if (r.kicker === net.sessionId) return `You kick ${k - g.k === 1 ? "next" : `in ${k - g.k} turns`}`; if (r.keeper === net.sessionId) return `You're in goal ${k - g.k === 1 ? "next" : `in ${k - g.k} turns`}`; }
  return "";
}
function showBoard(goals) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (goals > 0 ? board.submit(goals, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No goals yet. Score the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { const g = game(); if (g && g.phase === "over") { myReady = g.id; net.me.set("rdy", g.id); } };
/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again. */
function fixColor() {
  if (!Object.entries(S.entities.players || {}).some(([id, p]) => id < net.sessionId && p.c === myColor)) return;
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const keys = new Set();
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), goalPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hitP = new THREE.Vector3();
/** The pointer turned into a spot on the goal mouth, through the camera that drew the frame. */
function aimAtPointer(x, y) {
  ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(goalPlane, hitP)) return;
  me.ax = clamp(hitP.x / GW, -1.25, 1.25); me.ay = clamp(hitP.y / GH, 0, 1.3);
}
let drag = null; // a finger moving the aim: { id, x, y }
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase(); unlockAudio();
  if (["arrowleft", "arrowright", "arrowup", "arrowdown", " "].includes(k)) e.preventDefault();
  keys.add(k);
  if (e.repeat) return;
  const role = myRole(game());
  if (role === "kick" && (k === " " || k === "enter")) startCharge();
  if (role === "keep") { if (k === "arrowleft" || k === "a") dive(-1); if (k === "arrowdown" || k === "s" || k === " ") dive(0); if (k === "arrowright" || k === "d") dive(1); }
});
addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); keys.delete(k); if (k === " " || k === "enter") releaseCharge(); });
addEventListener("blur", () => { keys.clear(); me.charging = false; });
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); unlockAudio();
  if (myRole(game()) !== "kick" || me.pick) return;
  if (e.pointerType === "mouse") { aimAtPointer(e.clientX, e.clientY); startCharge(); return; }
  if (!drag) { drag = { id: e.pointerId, x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener("pointermove", (e) => {
  if (myRole(game()) !== "kick" || me.pick) return;
  if (e.pointerType === "mouse") { aimAtPointer(e.clientX, e.clientY); return; }
  if (!drag || e.pointerId !== drag.id) return;
  me.ax = clamp(me.ax + (e.clientX - drag.x) / 110, -1.25, 1.25); me.ay = clamp(me.ay - (e.clientY - drag.y) / 140, 0, 1.3); // relative drag: your finger never covers the goal
  drag.x = e.clientX; drag.y = e.clientY;
});
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => { if (e.pointerType === "mouse") releaseCharge(); if (drag && e.pointerId === drag.id) drag = null; });
const kickBtn = $("bKick");
kickBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); unlockAudio(); kickBtn.setPointerCapture(e.pointerId); startCharge(); });
for (const ev of ["pointerup", "pointercancel"]) kickBtn.addEventListener(ev, () => releaseCharge());
for (const b of $("keepUI").querySelectorAll("button")) b.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); unlockAudio(); dive(+b.dataset.dv); });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastReal = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const real = performance.now(); // a freeze is measured on the real clock (the frame's own time can be stale after one)
  if (real - lastReal > 1000) { host.wasHost = false; host.last = null; host.picks = null; host.quietUntil = real + 700; } // woke up: wait for fresh state, then adopt it
  lastReal = real;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  noteHostClock();
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const g = game();
  if (g) {
    myTick(g, now); aimKeys(dt);
    drawWorld(g, dt, now);
    if (now - lastHud > 90) { lastHud = now; hud(g, now); }
  }
  tickNet(now); tickParts(dt); tickCrowd(dt, now);
  renderer.render(scene, camera);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("pick", (m, from) => { if (isHost()) applyPick(from, m); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { introMs: 300, botPickMs: [150, 350], kickMs: 2500, resultsMs: 1500 });
  if (ATTRACT || TEST) window.__pk = () => ({ g: game(), host: isHost(), me: net.sessionId, role: myRole(game()), pick: me.pick, hostPicks: host.picks,
    kick: (ax, ay, pw) => lockPick({ role: "kick", ax, ay, pw }), dive: (dv) => dive(dv) }); // for test scripts only
  requestAnimationFrame(frame);
})();
</script>
